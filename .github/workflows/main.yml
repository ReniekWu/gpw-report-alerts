name: Test-issue email

on:
  workflow_dispatch:

jobs:
  espi_test:
    runs-on: ubuntu-latest

    steps:
      - name: Test ESPI RSS – bezpieczne pobieranie
        uses: actions/github-script@v7
        with:
          script: |
            const https = require('https');

            const fetchSafe = (url) => new Promise((resolve) => {
              const req = https.get(url, {
                headers: {
                  'User-Agent': 'Mozilla/5.0 (compatible; AuditBot/1.0)'
                },
                timeout: 15000
              }, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => resolve(data));
              });

              req.on('error', err => {
                console.log('Błąd sieci (ignorowany):', err.message);
                resolve(null);
              });

              req.on('timeout', () => {
                console.log('Timeout – połączenie zerwane');
                req.destroy();
                resolve(null);
              });
            });

            const espiUrl = 'https://www.gpw.pl/espi-rss';
            console.log('Pobieram ESPI RSS:', espiUrl);

            const xml = await fetchSafe(espiUrl);

            if (!xml) {
              console.log('Nie udało się pobrać ESPI RSS (blokada serwera)');
              return;
            }

            const items = xml.split('<item>').slice(1);

            for (const item of items) {
              if (!item.toLowerCase().includes('raport roczny')) continue;

              const pdfs = [...item.matchAll(/https?:\/\/[^<"]+\.pdf/gi)]
                .map(m => m[0]);

              if (pdfs.length > 0) {
                console.log('\nZnaleziono PDF:');
                pdfs.forEach(p => console.log(p));
              }
            }
