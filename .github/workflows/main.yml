name: Test-issue email

on:
  workflow_dispatch:

jobs:
  espi_test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Test ESPI – wypisz PDF raportów rocznych
        uses: actions/github-script@v7
        with:
          script: |
            const https = require('https');

            const fetch = (url) => new Promise((resolve, reject) => {
              https.get(url, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => resolve(data));
              }).on('error', reject);
            });

            const espiUrl = 'https://www.gpw.pl/espi-rss';
            console.log('Pobieram ESPI RSS:', espiUrl);

            const xml = await fetch(espiUrl);
            const items = xml.split('<item>').slice(1);

            for (const item of items) {
              if (!item.includes('Raport roczny')) continue;

              const pdfs = [...item.matchAll(/https?:\/\/[^<"]+\.pdf/gi)]
                .map(m => m[0]);

              if (pdfs.length > 0) {
                console.log('\nZnaleziono PDF:');
                pdfs.forEach(p => console.log(p));
              }
            }
