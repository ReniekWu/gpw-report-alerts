name: PAP – raport roczny (alert)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Sprawdź raporty roczne PAP i utwórz Issue
        uses: actions/github-script@v7
        with:
          script: |
            const https = require('https');

            const fetchHtml = (url) => new Promise((resolve, reject) => {
              https.get(url, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => resolve(data));
              }).on('error', reject);
            });

            const url = 'https://biznes.pap.pl/espi/periodic/2025';
            console.log('Pobieram:', url);

            const html = await fetchHtml(url);

            if (html.includes('Raport roczny')) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '📊 Raport roczny – nowa publikacja',
                body:
                  'Na stronie PAP pojawił się raport roczny.\n\n' +
                  'Link:\n' +
                  url
              });

              console.log('Issue utworzone');
            } else {
              console.log('Brak raportów rocznych');
            }
