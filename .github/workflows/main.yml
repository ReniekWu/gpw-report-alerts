name: Test-issue email

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Sprawdź RAPORTY ROCZNE (PAP) i wypisz ZAŁĄCZNIKI
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const https = require('https');

            // =========================
            // KONFIGURACJA
            // =========================
            const BASE_URL = 'https://biznes.pap.pl/espi/periodic/';
            const YEARS_BACK = 2;
            const TITLE_FILTER = 'Raport roczny';

            // =========================
            // 1. WCZYTAJ SPÓŁKI Z CSV
            // =========================
            const csv = fs.readFileSync('spolki.csv', 'utf8');
            const companies = csv
              .split('\n')
              .slice(1)
              .map(l => l.trim())
              .filter(Boolean);

            console.log('SPÓŁKI Z CSV:', companies);

            // =========================
            // FUNKCJA POBIERANIA HTML
            // =========================
            const fetchHtml = (url) => new Promise((resolve, reject) => {
              https.get(url, res => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => resolve(data));
              }).on('error', reject);
            });

            // =========================
            // 2. ITERACJA PO LATACH
            // =========================
            const currentYear = new Date().getFullYear();
            const years = Array.from({ length: YEARS_BACK + 1 }, (_, i) => currentYear - i);

            for (const year of years) {
              const url = `${BASE_URL}${year}`;
              console.log('Pobieram:', url);

              const html = await fetchHtml(url);
              const rows = html.split('<tr').slice(1);

              for (const row of rows) {

                // FIRMA
                const firmaMatch = row.match(/<td[^>]*>\s*([^<]+)\s*<\/td>/);
                if (!firmaMatch) continue;
                const firma = firmaMatch[1].trim();

                // TYTUŁ
                if (!row.includes(TITLE_FILTER)) continue;

                // LINK DO SZCZEGÓŁU
                const linkMatch = row.match(/href="([^"]+)"/);
                if (!linkMatch) continue;
                const detailLink = linkMatch[1];

                if (!companies.includes(firma)) continue;

                console.log(`\nRAPORT: ${firma} (${year})`);
                console.log('Strona szczegółu:', detailLink);

                // =========================
                // ETAP 2A: ZNAJDŹ ZAŁĄCZNIKI
                // =========================
                const detailHtml = await fetchHtml(detailLink);

                const attachmentMatches = [...detailHtml.matchAll(/href="([^"]+attachment[^"]+)"/gi)]
                  .map(m => m[1]);

                if (attachmentMatches.length === 0) {
                  console.log('Brak załączników');
                } else {
                  console.log('Znalezione ZAŁĄCZNIKI:');
                  attachmentMatches.forEach(a => console.log(a));
                }
              }
            }
