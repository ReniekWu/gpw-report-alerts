name: Test-issue email

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - uses: actions/checkout@v4
- name: Sprawdź RAPORTY ROCZNE (PAP) i utwórz Issue
  uses: actions/github-script@v7
  with:
    script: |
            const fs = require('fs');
            const https = require('https');

            // === KONFIGURACJA ===
            const YEARS_BACK = 2; // ile lat wstecz (0 = tylko bieżący)
            const BASE_URL = 'https://biznes.pap.pl/espi/periodic/';
            const STATE_FILE = 'pap_state.json';
            const TITLE_FILTER = 'Raport roczny';

            // === 1. Wczytaj spółki z CSV (pełne nazwy jak w kolumnie FIRMA) ===
            const csv = fs.readFileSync('spolki.csv', 'utf8');
            const companies = csv.split('\n').slice(1).map(l => l.trim()).filter(Boolean);
            console.log('SPÓŁKI (CSV):', companies);

            // === 2. Wczytaj stan (żeby nie dublować) ===
            let state = {};
            try { state = JSON.parse(fs.readFileSync(STATE_FILE, 'utf8')); } catch {}

            const fetchHtml = (url) => new Promise((resolve, reject) => {
              https.get(url, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => resolve(data));
              }).on('error', reject);
            });

            const currentYear = new Date().getFullYear();
            const years = Array.from({length: YEARS_BACK + 1}, (_, i) => currentYear - i);
            console.log('LATA DO SPRAWDZENIA:', years);

            for (const year of years) {
              const url = `${BASE_URL}${year}`;
              console.log('Pobieram:', url);
              const html = await fetchHtml(url);

              // Każdy wiersz tabeli (uprościłem do bezpiecznego regexu)
              const rows = html.split('<tr').slice(1);

              for (const row of rows) {
                // FIRMA
                const firmaMatch = row.match(/<td[^>]*>\s*([^<]+)\s*<\/td>/);
                if (!firmaMatch) continue;
                const firma = firmaMatch[1].trim();

                // TYTUŁ
                const tytulMatch = row.match(/<td[^>]*>[\s\S]*?<\/td>\s*<td[^>]*>\s*([^<]+)\s*<\/td>/);
                const tytul = tytulMatch ? tytulMatch[1].trim() : '';
                if (!tytul.includes(TITLE_FILTER)) continue;

                // Link do szczegółu
                const linkMatch = row.match(/href="([^"]+)"/);
                if (!linkMatch) continue;
                const detailLink = linkMatch[1];

                // Spółka musi być w CSV (pełna nazwa)
                if (!companies.includes(firma)) continue;

                const key = `${year}|${firma}|${tytul}`;
                if (state[key]) continue; // już obsłużony

                // === 3. Issue + e-mail ===
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: `📊 Raport roczny – ${firma} (${year})`,
                  body:
                    `**FIRMA:** ${firma}\n` +
                    `**TYTUŁ:** ${tytul}\n` +
                    `**Rok:** ${year}\n\n` +
                    `Link do publikacji PAP:\n${detailLink}\n\n` +
                    `🧾 Checklist audytorska:\n` +
                    `- kompletność sprawozdania\n` +
                    `- zgodność z UoR/IFRS\n` +
                    `- kontynuacja działalności\n` +
                    `- zdarzenia po dniu bilansowym\n`
                });

                state[key] = true;
                console.log('Utworzono Issue:', key);
              }
            }

            fs.writeFileSync(STATE_FILE, JSON.stringify(state, null, 2));
