name: Test – Issue → e-mail

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Utwórz testowe Issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "AUTOMAT – test GitHub Actions",
              body: "Jeżeli dostajesz tego maila, automat działa poprawnie."
            })
